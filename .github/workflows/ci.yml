name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/Foldspace.Core.Tests -c Release

      - name: Publish
        run: dotnet publish src/Foldspace.App -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Foldspace-win-x64
          path: out/Foldspace.exe
